[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathahead"
version = "1.1.1"
description = "An open engine for understanding education pathways. Local-first, cited, and honest about what it does not know."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Baijayanta Roy" }]
keywords = ["education", "singapore", "admissions", "psle", "a-level", "open-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Education",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Education",
]
dependencies = ["PyYAML>=6.0,<7"]

[project.urls]
Homepage = "https://github.com/BaijayantaRoy/path-ahead"
Issues = "https://github.com/BaijayantaRoy/path-ahead/issues"

[project.scripts]
pathahead = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools]
packages = ["engine", "engine.rules", "app", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",    # long lines in data-heavy modules are fine
  "RUF001",  # curly quotes appear in user-facing copy on purpose
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
