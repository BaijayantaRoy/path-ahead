# The calendar — what has to happen, and roughly when.
#
# The question a family actually asks is not "what is my score" but "what
# closes first". Missing an application window is worse than missing a grade
# profile by two points, and unlike the grade profile it is preventable.
#
# EVERY DATE HERE IS APPROXIMATE and marked as such in the app. Institutions
# publish exact dates each cycle and move them; PathAhead's job is to make sure
# nobody is surprised, then send them to the official page. `year_offset` is
# relative to the exam year, so one declaration serves every cohort.

milestones:
  - id: alevel-results
    label: A-Level results released
    detail: >
      Results are released by SEAB through your school, usually in the second
      half of February following the examination.
    year_offset: 1
    month: 2
    day: 20
    kind: result
    applies_to: [a-level]
    url: https://www.seab.gov.sg/
    fact:
      value: A-Level results released in February following the examination
      as_of_year: 2026
      source: moe-ecg
      confidence: medium
      stale_after: 2027-06-30
      note: >
        Month is well established; the exact day is published each cycle.

  - id: university-application-opens
    label: University applications open
    detail: >
      The autonomous universities open applications shortly after results. Each
      one runs its own exercise with its own window — check every university on
      your list separately, because they do not all close on the same day.
    year_offset: 1
    month: 2
    day: 22
    kind: application
    applies_to: [a-level]
    url: https://www.nus.edu.sg/oam/admissions/important-dates
    fact:
      value: Applications open shortly after results release
      as_of_year: 2026
      source: nus-important-dates
      confidence: medium
      stale_after: 2027-06-30

  - id: university-application-closes
    label: University applications close
    detail: >
      This is the deadline that matters most, and the one families miss. Windows
      differ between universities — confirm the exact date for each on your list
      rather than assuming they match.
    year_offset: 1
    month: 3
    day: 19
    kind: application
    applies_to: [a-level]
    url: https://www.nus.edu.sg/oam/admissions/important-dates
    fact:
      value: Application window closes in March
      as_of_year: 2026
      source: nus-important-dates
      confidence: medium
      stale_after: 2027-06-30
      note: >
        Approximate. Confirm per university — this is the single highest-cost
        date to get wrong.

  - id: interviews-and-tests
    label: Interviews, tests and portfolio reviews
    detail: >
      Courses that assess beyond grades — Medicine, Dentistry, Law, Architecture,
      Industrial Design, Nursing, PPE and others — schedule these in the months
      after applications close. Faculties publish their own dates.
    year_offset: 1
    month: 4
    day: 15
    kind: assessment
    applies_to: [a-level]
    url: https://www.nus.edu.sg/oam/admissions/faculty-interview-and-test-dates
    fact:
      value: Faculty interview and test dates published separately per programme
      as_of_year: 2026
      source: nus-interview-dates
      confidence: high
      stale_after: 2027-06-30

  - id: offers-released
    label: Offers released
    detail: >
      Offers arrive in waves rather than all at once. Not hearing on the first
      day is normal and means nothing.
    year_offset: 1
    month: 5
    day: 20
    kind: decision
    applies_to: [a-level]
    url: https://www.nus.edu.sg/oam/admissions/respond-to-admission-offer
    fact:
      value: Offers released in waves from around May
      as_of_year: 2026
      source: nus-important-dates
      confidence: medium
      stale_after: 2027-06-30

  - id: accept-offer
    label: Deadline to accept an offer
    detail: >
      Acceptance windows are short — often days, not weeks. Decide in advance
      what you will do if two offers arrive, so you are not deciding under time
      pressure.
    year_offset: 1
    month: 6
    day: 5
    kind: decision
    applies_to: [a-level]
    url: https://www.nus.edu.sg/oam/admissions/respond-to-admission-offer
    fact:
      value: Acceptance deadline shortly after an offer is made
      as_of_year: 2026
      source: nus-important-dates
      confidence: medium
      stale_after: 2027-06-30

  # NOTE — there is deliberately no "appeal window" milestone.
  #
  # An earlier draft carried one, dated by guesswork because appeal windows are
  # not published consistently in one place. The Data Health gate rejected it
  # for being below the confidence floor, which was the correct outcome: a tool
  # that refuses to show an invented cut-off must equally refuse to show an
  # invented date. Appeals are covered instead in routes.yaml as a
  # second-chance route, where the honest instruction is "ask the admissions
  # office what its process actually allows" rather than a date to diarise.

  - id: ns-enlistment
    label: National Service enlistment
    detail: >
      If National Service applies, you would normally apply for and accept a
      place, then defer it. Universities run a distinct admissions path for
      returning servicemen — this is an ordinary published route, not a setback.
    year_offset: 1
    month: 7
    day: 1
    kind: service
    applies_to: [a-level]
    requires_service: true
    url: https://www.nus.edu.sg/oam/admissions/reserved-places-in-nus/information-for-full-time-national-servicemen
    fact:
      value: Places may be reserved and deferred for full-time National Servicemen
      as_of_year: 2026
      source: nus-nsmen
      confidence: high
      stale_after: 2027-06-30

  - id: open-house
    label: Open house season
    detail: >
      Worth more than any website, including this one. Go, ask what a normal
      week looks like, and ask a current student what they would change.
    year_offset: 1
    month: 3
    day: 1
    kind: event
    applies_to: [a-level]
    url: https://www.nus.edu.sg/oam/why-nus/admissions-oh2026
    fact:
      value: University open houses run around the application period
      as_of_year: 2026
      source: nus-important-dates
      confidence: medium
      stale_after: 2027-06-30

  # ---------------------------------------------------------------------
  # PSLE — the exam itself and what follows it.
  #
  # Unlike the A-Level milestones above, these do not lead to an application
  # window a family has to act on; they are dates a family needs simply to
  # know when to expect something. `year_offset: 0` throughout because every
  # one of these happens within the PSLE cohort's own exam year — there is no
  # "the year after" here the way there is for A-Level results and admission.
  # ---------------------------------------------------------------------

  - id: psle-oral-exams
    label: Oral examinations (English & Mother Tongue)
    detail: >
      Held over two days in mid-August, about six weeks before the written
      papers. The exact two days shift by a day or so year to year — 2025 was
      13-14 August, 2026 is 12-13 August.
    year_offset: 0
    month: 8
    day: 12
    kind: assessment
    applies_to: [psle]
    url: https://file.go.gov.sg/2026-psle-exam-cal.pdf
    fact:
      value: Oral exams held over two days in mid-August
      as_of_year: 2026
      source: moe-psle-exam-calendar-2026
      confidence: high
      stale_after: 2027-06-30
      note: >
        2026: 12-13 August. Confirm the exact days via SEAB's published
        timetable each year rather than assuming this date repeats.

  - id: psle-written-exams
    label: Written examinations
    detail: >
      The main papers — English, Mathematics, Science and Mother Tongue —
      run over about a week, typically the last week of September into the
      first day or two of October.
    year_offset: 0
    month: 9
    day: 24
    kind: assessment
    applies_to: [psle]
    url: https://file.go.gov.sg/2026-psle-exam-cal.pdf
    fact:
      value: Written exams run over about a week, late September to early October
      as_of_year: 2026
      source: moe-psle-exam-calendar-2026
      confidence: high
      stale_after: 2027-06-30
      note: >
        2026: 24-30 September (English 24, Mathematics 25, Mother Tongue
        languages 28, Science 29, Higher Mother Tongue 30). 2025 was 25
        September - 1 October. Confirm the exact per-subject days via SEAB's
        published timetable each year.

  - id: psle-results-released
    label: PSLE results released
    detail: >
      Released about eight weeks after the last written paper, generally in
      the third or fourth week of November.
    year_offset: 0
    month: 11
    day: 24
    kind: result
    applies_to: [psle]
    url: https://www.moe.gov.sg/national-exams-dates
    fact:
      value: Results released in the second half of November
      as_of_year: 2026
      source: moe-psle-results-2026
      confidence: medium
      stale_after: 2027-06-30
      note: >
        2026: MOE states tentatively 24-25 November. 2025 was 25 November;
        2024 was 20 November — a swing of a few days either way is normal.
        Confirm via MOE's own notice closer to the date, since this one is
        explicitly still tentative.

  - id: psle-s1-posting-results
    label: Secondary 1 posting results
    detail: >
      Comes roughly three weeks after the PSLE results themselves, once
      families have submitted their six school choices — generally in the
      first half of December.
    year_offset: 0
    month: 12
    day: 12
    kind: result
    applies_to: [psle]
    url: https://www.moe.gov.sg/news/press-releases/20251212-2025-secondary-1-posting-results
    fact:
      value: Posting results released roughly three weeks after PSLE results, in early-to-mid December
      as_of_year: 2026
      source: moe-s1-posting-results-pattern
      confidence: medium
      stale_after: 2027-06-30
      note: >
        2025 was 12 December; 2024 was 11 December. MOE has not yet published
        the exact 2026 date at the time this was written — treat this one as
        the least certain date on this page and check MOE's announcement once
        the PSLE results themselves are out.
