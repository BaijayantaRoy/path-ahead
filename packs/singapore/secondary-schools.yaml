# PathAhead data pack: Singapore secondary schools — the shortlisting stage
#
# 147 schools a PSLE cohort can actually be posted to at S1, transcribed from
# MOE's own "General information of schools" dataset on data.gov.sg, under the
# Singapore Open Data Licence v1.0 -- NOT from SchoolFinder, whose Terms of Use
# permit citing and deep-linking but not copying. This is the licensing gap
# psle.yaml's "what is not here yet" note flagged; this file closes it for the
# DIRECTORY data (name, location, type, gender, SAP/IP/autonomous status) while
# leaving the COP/Posting-Group-by-school gap exactly where it was, because no
# permissively licensed source for THAT exists (verified 2026-08-10 -- see
# tools/build_secondary_schools_pack.py's module docstring for the search).
#
# WHAT THIS DOES NOT ANSWER: "can my child get into this school." That question
# needs a cut-off point, which is not in here for the reason above -- ask it on
# the Posting Group calculator this page already has. This file answers a
# DIFFERENT, narrower question: among schools your family could plausibly list,
# which ones match what you've said matters to you (location, co-ed preference,
# SAP, Integrated Programme). The two questions are never blended into one
# number -- see engine/school_fit.py's module docstring, which is the school-
# scoring equivalent of engine/fit.py's A-Level course-fit engine and follows
# the identical rule: eligibility and fit are different axes, and only
# eligibility ever gates a result.
#
# WHAT IS DELIBERATELY NOT IN THIS FILE, AND WHY:
#   - Cut-off points / Posting Groups per school -- no permissively licensed
#     source exists; see above.
#   - CCA (co-curricular activity) offerings -- a data.gov.sg dataset exists
#     but could not be reliably pulled and cleaned in this pass; a real gap,
#     not a silent one. Tracked as follow-up work, not filled with a guess.
#   - Religious affiliation and primary-school affiliation (e.g. which
#     secondary schools a given primary school's students are affiliated
#     to) -- true and checkable per school, but not in any bulk licensed
#     dataset. Hand-curating 147 schools one at a time is exactly the kind
#     of unverifiable transcription this project avoids, so it is left out
#     rather than guessed at.

sources:
  - id: datagovsg-school-directory-2026
    name: General information of schools
    publisher: Ministry of Education, Singapore (via data.gov.sg)
    url: https://data.gov.sg/datasets/d_688b934f82c1059ed0a6993d2a829089/view
    retrieved: 2026-08-10
    licence: sg-odl-1.0
    note: >
      337 schools, all levels; 147 of them can take a normal PSLE-to-S1 intake
      and are the ones loaded here. Name, address, postal code, MRT/bus
      description, school type, gender composition, SAP/Autonomous/Gifted/IP
      indicator flags -- transcribed verbatim, one field renamed for clarity
      ("nature_code" -> gender) and none reinterpreted. Licensed under the
      Singapore Open Data Licence v1.0, which permits commercial use,
      modification and redistribution with attribution -- a materially
      different, more permissive grant than SchoolFinder's cite-and-link-only
      terms.
  - id: singpost-postal-districts
    name: Singapore Postal Districts (SingPost district scheme)
    publisher: Singapore Post, via secondary transcription
    url: https://www.penang-traveltips.com/singapore/postal-districts.htm
    retrieved: 2026-08-10
    licence: institution-tou
    note: >
      The 28-district, 81-sector table used to turn a postal code into a
      district and a coarse region. This is structural, decades-old public
      information (SingPost's own delivery scheme, referenced by Wikipedia's
      "Postal codes in Singapore" article) rather than a licensed dataset in
      its own right, so it is recorded under PathAhead's "facts cited and
      linked, nothing reproduced wholesale" licence code rather than an
      open-data one -- the table below is transcribed for citation, the way
      any fact in this project is, not redistributed as someone else's
      dataset. The REGION column (Central/North/North-East/East/West) is
      PathAhead's own editorial grouping of the 28 districts, not part of any
      cited source -- see engine/school_fit.py.
  - id: onemap-geocoding-2026
    name: OneMap Singapore search API (address/postal code geocoding)
    publisher: Singapore Land Authority
    url: https://www.onemap.gov.sg/apidocs/
    retrieved: 2026-08-13
    licence: sg-odl-1.0
    note: >
      Latitude/longitude for each school's own postal code, and one
      representative anchor point per postal district (the first named place
      in that district's `area` field). Used only to compute a real, honestly
      labelled straight-line distance -- never a routed travel time, and never
      a live call made with a family's own postal code. Governed by the
      Singapore Open Data Licence, per OneMap's own Terms of Use.
  - id: moe-schoolfinder
    name: MOE SchoolFinder -- each school's own page
    publisher: Ministry of Education, Singapore
    url: https://www.moe.gov.sg/schoolfinder
    retrieved: 2026-08-14
    licence: moe-tou-linked
    note: >
      MOE publishes each secondary school's Posting Group and Integrated
      Programme PSLE Score ranges on that school's own SchoolFinder page.
      PathAhead does NOT reproduce those figures. They are published under
      MOE's Terms of Use, which reserve reproduction, and a compiled table of
      every school's cut-off is additionally somebody's compilation. Anyone
      may read them; that is not the same as this project being free to
      redistribute them under MIT. So the app carries a per-school deep link
      instead, and the reader opens the official page and reads the current
      figures at source -- unaltered, in context, and never stale, which a
      copied snapshot would eventually be.
      MOE's own words apply to every figure a reader will find there: cut-off
      points "can fluctuate by a few points year-on-year" and meeting one
      "does not guarantee admission". They are a record of last year's
      exercise, not a threshold for this one.

