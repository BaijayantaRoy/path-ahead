outcomes:
- id: nyp-biomedical-science-with-analytics
  institution: Nanyang Polytechnic
  institution_short: NYP
  name: Biomedical Science with Analytics
  transition: a-level-to-university-2026
  url: https://www.nyp.edu.sg/student/study/courses
  route_group: polytechnic-diploma
  tags:
  - polytechnic
  - diploma
  - nyp
  duration:
    years: 3
    structure: Three years full-time. An A-Level holder entering through the Direct
      Admissions Exercise is admitted to a shortened 2 or 2.5-year version of the
      same diploma, subject to places being available.
    fact:
      value: 3 years full-time
      as_of_year: 2026
      source: nyp-cop-datagov
      confidence: high
      stale_after: 2027-06-30
  progression:
  - label: A degree at one of Singapore's autonomous universities
    exemption: advanced standing considered case by case
    detail: Polytechnic diploma holders apply to NUS, NTU, SMU, SUTD, SIT and SUSS
      through the diploma admissions route rather than on A-Level results, and each
      university publishes its own indicative polytechnic GPA. Exemptions and shortened
      candidature are decided by the receiving university, not by the polytechnic,
      and vary by subject match.
    fact:
      value: eligible to apply for university admission as a diploma holder
      as_of_year: 2026
      source: nyp-cop-datagov
      confidence: medium
      stale_after: 2027-06-30
  cost:
    annual_fee_citizen: 3100
    annual_fee_pr: 6400
    annual_fee_international: 12400
    annual_fee_is_other: 13600
    years: 3
    tuition_grant_available: true
    bond_years_citizen: 0
    bond_years_pr_is: 3
    bond_note: Singapore Citizens owe no bond for the tuition grant itself. Permanent
      Residents and international students who accept it must work for a Singapore
      entity for 3 years after graduating. The polytechnic states that buying out
      of the bond means liquidated damages set by MOE, not simply repaying the grant.
    fact:
      value: SGD 3100/yr citizen, 6400 PR, 12400 international (ASEAN), 13600 (non-ASEAN)
      as_of_year: 2026
      source: nyp-fees
      confidence: high
      stale_after: 2027-04-30
      note: "Subsidised annual tuition for a student who accepts the MOE Tuition Grant,\
        \ for the cohort admitted in 2026. Polytechnics fix the fee for the whole\
        \ course, so this is the rate for all three years. On top of tuition comes\
        \ a supplementary fee of SGD 88.09 for a citizen, 118.09 for a PR and 178.59\
        \ for an international student a year, covering things like examinations,\
        \ insurance and the student union \xE2\u20AC\u201D small, but it is billed.\
        \ Citizen and PR figures exclude GST, which MOE subsidises; the international\
        \ figures include it. A Singapore Citizen aged 40 or above pays SGD 2,100\
        \ under the SkillsFuture Mid-Career Enhanced Subsidy; the figure shown here\
        \ is the under-40 rate. The fee for a student who does not take the tuition\
        \ grant is not recorded, because the polytechnic does not publish one. Nanyang\
        \ Polytechnic states the table is correct as of 14 May 2026. NYP publishes\
        \ the same table for the 2023, 2024 and 2025 intakes, and the AY2026 non-ASEAN\
        \ rate is the first year it differs from the ASEAN one."
  band:
    p10: '6'
    p90: '8'
    p10_points: 6
    p90_points: 8
    statistic: min_max
    scale: elr2b2_olevel
    comparable: false
    basis: net ELR2B2 O-Level aggregate, where lower is better
    fact:
      value: 6 to 8
      as_of_year: 2026
      source: nyp-cop-datagov
      confidence: high
      stale_after: 2027-06-30
      note: 'Net ELR2B2 aggregate, after CCA bonus points, of the lowest and highest
        ranked student admitted to JAE course code C25 in the 2026 Joint Admissions
        Exercise. This is the whole admitted cohort, not a middle percentile band,
        so it is wider than a university''s published range by construction. It is
        an O-Level statistic: an A-Level holder admitted through JAE is admitted on
        their O-Level results, and one admitted through the Direct Admissions Exercise
        is assessed on academic results and interview with no published aggregate
        at all. PathAhead therefore shows this figure and does not compare it with
        an A-Level score.'
  editorial:
    interests:
    - I
    subject_affinity:
    - biology
    - chemistry
    assessment_style:
    - practical
    - exams
    teamwork: mixed
    maths_intensity: medium
    writing_intensity: medium
    sectors:
    - healthcare
    - research
    summary: Human biology and diagnostics, taught around laboratory technique and
      data.
    fact:
      value: PathAhead's own description of this course
      as_of_year: 2026
      source: pathahead-editorial
      confidence: medium
      basis: editorial
      stale_after: 2027-06-30
      note: NOT the polytechnic's description, and written at course-FAMILY level
        rather than for this course specifically. If it is wrong, please tell us.
