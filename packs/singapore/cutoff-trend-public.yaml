# Third-party PSLE cut-off point trend, 2021-2025 -- NOT an MOE publication.
#
# Source: SG School Kaki (unofficial, community-compiled), a public site that
# compiles MOE's own yearly Secondary School COP releases into one table.
# https://sgschoolkaki.com/psle-trends -- fetched 2026-08-30.
#
# Each number is the school's Posting Group 3 cut-off point (the boundary
# between PG3 and PG2 -- the single figure schools and newspapers have always
# quoted as "the" cut-off, going back to before PG1/PG2/PG3 existed as separate
# bands). Spot-checked against MOE's own live 2025 SchoolFinder figure for four
# schools spanning very different profiles (an SAP-adjacent school, an average
# neighbourhood school, a school whose cut-off moved sharply year over year, and
# a girls' school with no PG1 at all) before being trusted -- every one matched
# exactly. Earlier years (2021-2024) could not be independently checked the same
# way: no official multi-year archive of SchoolFinder exists anywhere reachable
# (see docs/LOCAL_DATA.md). See CHANGELOG.md for the full spot-check writeup.
#
# This file is DELIBERATELY separate from packs/singapore/local/cutoff.json:
# that file holds MOE's own current-year PG3/PG2/PG1/IP figures, which this
# project does not republish (see engine/loader.py:_apply_local_overlays) and
# which therefore stays local-only, gitignored, never committed. This file is a
# citation of a THIRD PARTY's own already-public compilation -- attributed,
# disclaimed inline wherever it is shown, and safe to ship in the public pack.

cutoff_public_trend_source:
  name: "SG School Kaki (unofficial, community-compiled)"
  url: "https://sgschoolkaki.com/psle-trends"
  fetched: "2026-08-30"
  disclaimer: >-
    Community-compiled figures, not an MOE publication. Shown for historical
    reference only, alongside -- never instead of -- this year's figure linked
    from MOE SchoolFinder above. Spot-checked against MOE's own 2025 figure for
    a sample of schools and matched exactly; earlier years could not be
    independently verified, because no official multi-year archive exists.

