# NTU and SMU destinations, from each university's own published
# Indicative Grade Profile for the 2026 admissions exercise.
#
# Both publish the same three tables NUS does: A-Level grade profiles at the
# 10th and 90th percentile, polytechnic GPAs for diploma holders, and places
# taken up. Both state plainly that meeting last year's profile does not
# guarantee admission, and both note that from AY2026/2027 the H1 content
# subject is no longer counted by default -- so the three H2 grades are the
# comparable part, exactly as PathAhead uses them.
#
# Editorial descriptions here are written at course-FAMILY level and say so.

outcomes:
  - id: ntu-medicine
    subject_requirements:
      - subjects: [chemistry]
        at_level: h2
        label: "H2 Level pass in Chemistry"
        detail: >-
          NTU publishes this in its Minimum Subject Requirements table for
          Singapore-Cambridge GCE 'A' Level applicants. Where it asks for a
          "good grade", PathAhead checks only that you offer the subject -- it
          does not hold your grades and will not guess at them.
        fact:
          value: "H2 Level pass in Chemistry"
          as_of_year: 2026
          source: ntu-msr-alevel
          confidence: high
          stale_after: 2027-02-28
          url: https://www.ntu.edu.sg/media/docs/default-source/undergraduate-admissions/msr/emsr_alevel.pdf
      - subjects: [biology, physics]
        at_level: h2
        label: "H2 Level pass in Biology/Physics"
        detail: >-
          NTU publishes this in its Minimum Subject Requirements table for
          Singapore-Cambridge GCE 'A' Level applicants. Where it asks for a
          "good grade", PathAhead checks only that you offer the subject -- it
          does not hold your grades and will not guess at them.
        fact:
          value: "H2 Level pass in Biology/Physics"
          as_of_year: 2026
          source: ntu-msr-alevel
          confidence: high
          stale_after: 2027-02-28
          url: https://www.ntu.edu.sg/media/docs/default-source/undergraduate-admissions/msr/emsr_alevel.pdf
    institution: Nanyang Technological University
    institution_short: NTU
    name: Medicine
    faculty: Lee Kong Chian School of Medicine
    transition: a-level-to-university-2026
    url: https://www.ntu.edu.sg/admissions/undergraduate/indicative-grade-profile
    route_group: university-direct
    tags: [university, ntu]
    band:
      p10: "AAA/A"
      p90: "AAA/A"
      p10_points: 60
      p90_points: 60
      basis: 3 H2 grades, out of 60
      fact:
        value: "AAA/A to AAA/A"
        as_of_year: 2025
        source: ntu-igp-2026
        confidence: high
        stale_after: 2027-01-31
        note: >-
          Representative grade profile of the 10th and 90th percentile of
          A-Level applicants offered places in AY2025/2026, as three H2 grades
          plus one H1. Grade C is assumed for General Paper and Project Work.
          Includes offers made under Aptitude-Based Admissions.
    intake:
      value: 189
      as_of_year: 2025
      source: ntu-igp-2026
      confidence: high
      stale_after: 2027-01-31
    cost:
      fee_group: Medicine
      annual_fee_citizen: 36100
      annual_fee_pr: 51850
      annual_fee_international: 80850
      annual_fee_is_other: 91250
      years: 5
      tuition_grant_available: true
      bond_years_citizen: 5
      bond_years_pr_is: 6
      bond_note: >-
        Singapore Citizens owe no bond for the tuition grant itself. Permanent
        Residents and international students who accept it must work for a Singapore
        entity for 3 years after graduating. Separately, everyone admitted to this
        programme takes a service obligation with the public healthcare sector: 5
        years for Singapore Citizens, 6 years for everyone else, counted after
        housemanship.
      fact:
        value: "SGD 36100/yr citizen, 51850 PR, 80850 international (ASEAN)"
        as_of_year: 2026
        source: ntu-fees
        confidence: high
        stale_after: 2027-04-30
        note: >-
          Annual tuition for the cohort accepting a programme offer in 2026. NTU
          records the non-subsidised rate for Medicine as Not Applicable, so the
          tuition grant is not optional on this programme. Five-year programme.
          Citizen and PR figures exclude GST; international and non-subsidised figures
          include it. NTU fixes the fee at the 2026 rate for the whole degree.
          Duration is the normal period of candidature published in NTU's Academic
          Handbook for Undergraduate Studies, Cohort AY2025-26.
    editorial:
      interests: ["I", "S"]
      subject_affinity: ["biology", "chemistry"]
      assessment_style: ["exams", "practical"]
      teamwork: team
      maths_intensity: medium
      writing_intensity: medium
      sectors: ["healthcare"]
      summary: >-
        Long, clinical and heavily structured, with training continuing well past graduation.
      fact:
        value: PathAhead's own description of this course
        as_of_year: 2026
        source: pathahead-editorial
        confidence: medium
        basis: editorial
        stale_after: 2027-06-30
        note: >-
          NOT the institution's description, and written at course-FAMILY level
          rather than for this course specifically. Less precise than the NUS
          entries. If it is wrong, please tell us.
    overlays:
      - kind: interview
        label: Additional assessment
        detail: >-
          This programme requires further assessment such as an interview,
          selection test, audition or portfolio. Grades are one part of the
          decision, not the whole of it.
        source: ntu-igp-2026
      - kind: subject_requirement
        label: Subject prerequisites
        detail: >-
          Programmes may require specific subjects. Check the university's own
          prerequisite list before committing to a subject combination.
        source: ntu-igp-2026

