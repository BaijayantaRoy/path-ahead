# Outcomes -- destinations, with everything a family actually asks about.
#
# Four kinds of information live here, and they are NOT the same kind of claim:
#
#   band        official, published by the institution. The 10th-90th
#               percentile of students admitted LAST year. Not a cutoff.
#   employment  official, from the Graduate Employment Survey via data.gov.sg
#               under the Singapore Open Data Licence. A range, never a bare
#               median, for the same reason the band is a range.
#   cost        official, and deliberately includes the tuition grant bond,
#               which families routinely discover far too late.
#   editorial   PathAhead's OWN characterisation of what a course is like.
#               An opinion. It exists so fit reasoning is possible at all, it
#               renders differently in the app, and it invites correction.
#
# Generated once from the published tables and then hand-maintained.

