  # Millennia Institute uses L1R4, not L1R5 -- the same rule kind and formula
  # as MI's own line in o-level-to-jc-mi-2027's `groups`, since that transition
  # scores L1R5 for JC courses. MI's course is scored against the SAME L1R5
  # derivation's comparison_component would be wrong -- MI is genuinely on
  # L1R4. Rather than force MI through the L1R5 rule, its three courses are
  # assessed against the R1..R3 subtotal of the SAME derivation (English + 3
  # relevant, before R4/R5 are added) via `comparison_component`, which is
  # exactly the mechanism the A-Level pack already uses to compare a 3-H2
  # subtotal out of a 4-component score. See `comparison_component` on the
  # transition above -- MI reads the R1-R2-R3 subtotal, not the full L1R5.
