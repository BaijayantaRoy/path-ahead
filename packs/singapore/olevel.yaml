# PathAhead data pack: Singapore — the O-Level stage, and the SEC cutover
#
# One exam feeds two published aggregates -- L1R5 for JC/MI and ELR2B2 for
# polytechnics -- so this file holds two transitions per era rather than one,
# both scored from the same entered grade sheet. See engine/forward.py
# `explore_secondary()` for how a second aggregate is computed without asking
# "what year are you in" twice.
#
# THE CUTOVER, in one paragraph: 2026 is the last year the GCE O-Level is
# awarded. A student who started Secondary 1 in 2023 sits it in 2026 and
# applies through the 2027 JAE under L1R5/ELR2B2 as they exist today. Everyone
# who started Secondary 1 in 2024 or later sits the Secondary Education
# Certificate instead, and applies through the 2028+ Post-Secondary Admissions
# Exercise under a DIFFERENT ceiling (L1R4 <= 16, not L1R5 <= 20) computed on
# G3-basis grades. The two must never be compared on one axis -- see
# SAFEGUARDS.md 4b2 and the caveats on each transition below.
#
# WHAT IS AND IS NOT REAL DATA HERE, STATED PLAINLY:
#
#   - The L1R5/ELR2B2/L1R4 FORMULAS are transcribed from moe.gov.sg, verified
#     2026-08-09, confidence high.
#   - The 16 JC/MI cut-off ranges are each read from that institution's own
#     MOE SchoolFinder page, individually dated and cited, confidence high.
#     16 of roughly 19 JAE-entry JCs. The missing ones were not a research
#     priority call -- see NEXT.md if this file still says so.
#   - The Polytechnic ELR2B2 ranges are not new: they are the ~330 outcomes
#     already loaded in outcomes-polytechnic.yaml for the A-Level pack, where
#     they are shown to A-Level students with the comparison declined (an
#     A-Level score cannot be placed against an O-Level statistic). For an
#     ACTUAL O-Level applicant that same range is their own basis, so this
#     file does not duplicate the data -- it adds a second transition id that
#     `also_scored_under` (see engine/model.py and the loader's
#     `_attach_cross_transition_reuse`) makes those same outcomes answer to.
#   - The ELR2B2 "2 relevant subjects" are course-specific in reality (an
#     Engineering diploma and a Business diploma name different subjects as
#     "relevant") and that per-course list is not loaded. This pack computes
#     the GENERIC form -- English plus the best 4 of everything else -- and
#     every screen that shows it says so. See the transition's caveats.
#   - The SEC-era (2028+) transitions compute a real aggregate from real
#     formulas, against NO course outcomes at all, because none exist to load:
#     PSE 2028 is the first year of a new system and no institution has
#     published a course-level cut-off under it. Asserting one would be
#     inventing a number nobody has published yet.

sources:
  - id: moe-jae-jc-mi-2027
    name: Junior colleges and Millennia Institute — admission criteria (2026/2027 basis)
    publisher: Ministry of Education, Singapore
    url: https://www.moe.gov.sg/post-secondary/admissions/jae/junior-colleges-and-millennia-institute
    retrieved: 2026-08-09
    licence: moe-tou
    note: >
      The L1R5 (JC) and L1R4 (MI) gross-aggregate formulas, the subject
      categories (Humanities / Mathematics or Science / any), grade
      requirements, conditional admission, and the CCA/language/affiliated-JC
      bonus-point tables. Last updated by MOE 2025-09-15. Bonus points are NOT
      modelled in this pack -- see the transition caveats -- so PathAhead
      computes the GROSS aggregate, which is the more conservative of the two
      figures a family will see.

  - id: moe-pse-jc-mi-2028
    name: Junior colleges and Millennia Institute — admission criteria from 2028 PSE
    publisher: Ministry of Education, Singapore
    url: https://www.moe.gov.sg/post-secondary/admissions/pse/jc-and-mi
    retrieved: 2026-08-09
    licence: moe-tou
    note: >
      The incoming L1R4 <= 16 (JC) / L1R4 <= 20 (MI) formula on G3-basis
      grades, effective from the 2028 Post-Secondary Admissions Exercise.
      Last updated by MOE 2026-03-16.

  - id: moe-pse-polytechnic-2028
    name: Polytechnic diploma course — admission criteria from 2028 PSE
    publisher: Ministry of Education, Singapore
    url: https://www.moe.gov.sg/post-secondary/admissions/pse/polytechnic-diploma-course
    retrieved: 2026-08-09
    licence: moe-tou
    note: >
      ELR2B2 net <= 22 (<= 24 for Nursing) from 2028, with B2 computed on the
      G2-equivalent grade even when the subject was taken at G3. This is NOT a
      tightening from today's <= 26 -- it is the same intake made to look
      harder by the mapping change alone. Last updated by MOE 2026-03-16.

  - id: seab-sec-2026
    name: Secondary Education Certificate (SEC)
    publisher: Singapore Examinations and Assessment Board
    url: https://www.seab.gov.sg/secondary-education-certificate-sec/
    retrieved: 2026-08-09
    licence: moe-tou
    note: >
      Confirms 2026 as the last O-Level/N-Level cohort, the G1/G2/G3 subject
      levels and their grade structures, and the G3->G2->G1 mapping table used
      to compute ELMAB3 and ELR2B2 aggregates from mixed-level subjects. Last
      updated by SEAB 2026-05-14.

