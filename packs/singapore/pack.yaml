  - id: moe-dsajc
    name: Direct School Admission for junior colleges (DSA-JC) — overview and how to apply
    publisher: Ministry of Education, Singapore
    url: https://www.moe.gov.sg/post-secondary/admissions/dsa
    retrieved: 2026-08-19
    licence: moe-tou
    note: >
      DSA-JC lets a student secure a place on talent, before O-Level/SEC
      results are out. Accepting an offer withdraws the student from JAE and
      from transferring to a different JC -- MOE's own page states this
      plainly, so PathAhead's caveat on the route repeats it rather than
      softening it.

  - id: ges-datagov
    name: Graduate Employment Survey - NTU, NUS, SIT, SMU, SUSS & SUTD
    publisher: Ministry of Education, via data.gov.sg
    url: https://data.gov.sg/dataset/graduate-employment-survey-ntu-nus-sit-smu-suss-sutd
    retrieved: 2026-08-02
    licence: sg-odl-1.0
    note: >
      Run jointly by the six autonomous universities, published by MOE, and made
      available on data.gov.sg under the Singapore Open Data Licence v1.0 --
      which permits redistribution with attribution. Graduates are surveyed
      roughly six months after their final examinations. Figures used here are
      the 2024 survey (the most recent in the dataset at retrieval), per degree:
      overall employment rate, gross monthly median, and the 25th and 75th
      percentiles. A median alone would invite being read as "what I will earn",
      so PathAhead always shows the range.

  - id: nus-important-dates
    name: Important Dates
    publisher: NUS Office of Admissions
    url: https://www.nus.edu.sg/oam/admissions/important-dates
    retrieved: 2026-08-02
    licence: institution-tou
    note: >
      Admission cycle dates. These move every year; PathAhead treats every one
      as approximate and links out rather than asserting a day.

