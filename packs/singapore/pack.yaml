# PathAhead data pack: Singapore
#
# This file is meant to be read by a teacher, a counsellor or a parent -- not
# only by a programmer. Nothing here executes. Every number carries the year it
# refers to, the source it came from, how confident we are in it, and the date
# after which it should no longer be shown as current.
#
# If you spot a wrong figure, please open an issue. There is a link on every
# number in the app.

pack:
  id: singapore
  country: SG
  name: Singapore
  version: sg-2026.1
  pack_format: 1
  published: 2026-08-02
  description: >
    Singapore's exam-to-next-stage pathways. This release covers the A-Level to
    university transition under the 70-point University Admission Score that
    applies from the 2026 cohort. PSLE and O-Level/SEC are planned; see
    ROADMAP.md.
  # Rendered in the app footer on every page and again, in full, on the
  # "Sources and licences" page. The second line is not editorial: the
  # Singapore Open Data Licence v1.0 requires that a product using an ODL
  # dataset carry "a conspicuous notice acknowledging the source of the
  # datasets and including a link to the most recent version of this
  # Licence", and gives the wording below as its own example. Naming the
  # datasets and the access date -- rather than a vague "some data comes
  # from data.gov.sg" -- is what the condition actually asks for. Reviewed
  # and tightened 2026-08-14.
  attribution:
    - >
      Figures are cited to, and linked from, their official publisher. PathAhead
      is not affiliated with, endorsed by, or connected to the Ministry of
      Education, SEAB, Cambridge Assessment, or any school, polytechnic, ITE or
      university.
    - >
      Contains information from the Graduate Employment Survey and the General
      information of schools datasets, accessed 2026-08-13 from data.gov.sg,
      which is made available under the terms of the Singapore Open Data Licence
      version 1.0 (https://data.gov.sg/open-data-licence).

sources:
  - id: nus-igp-2026
    name: Indicative Grade Profile
    publisher: NUS Office of Admissions
    url: https://www.nus.edu.sg/oam/admissions/indicative-grade-profile
    retrieved: 2026-08-02
    licence: institution-tou
    note: >
      Published January 2026. Table 1 gives representative grade profiles at the
      10th and 90th percentile of Singapore-Cambridge GCE A-Level applicants
      offered places in AY2025/2026, as three H2 grades plus one H1 grade. NUS
      states that Grade C is assumed for General Paper and Project Work in
      determining these profiles. Only the figures are recorded here; no NUS
      text, table layout or document is reproduced.

  - id: nus-uas-revision
    name: Revision to the University Admission Score computation
    publisher: NUS Office of Admissions
    url: https://www.nus.edu.sg/oam/docs/default-source/singapore-cambridge-gce-a-level/faqs-on-revised-uas-computation.pdf
    retrieved: 2026-08-02
    licence: institution-tou
    note: >
      Referenced from the NUS IGP page, which states that from AY2026/2027
      applicants presenting 2025 A-Level results will no longer have their H1
      content subject grade included in the UAS by default, and that no grade
      profile has yet been established on the new basis.

  - id: uas-grade-points-2026
    name: 70-point University Admission Score grade-point tables
    publisher: Multiple secondary explainers (pending primary confirmation)
    url: https://www.nus.edu.sg/oam/admissions/singapore-cambridge-gce-a-level/admission-requirements
    retrieved: 2026-08-02
    licence: institution-tou
    note: >
      CONFIDENCE MEDIUM. The component structure (three H2 subjects at 20 points
      each plus General Paper at 10, total 70; Project Work pass/fail; a fourth
      content subject counted only if it improves the total) is consistently
      reported and is consistent with the NUS notification. The exact
      grade-to-point table and the precise treatment when the optional subject
      would push the total above 70 have NOT been confirmed against a primary
      publication. Replace this source and raise the confidence before release.

  - id: nus-prerequisites
    name: Programme Prerequisites
