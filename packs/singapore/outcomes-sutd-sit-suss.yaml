      - kind: subject_requirement
        label: SUTD publishes a subject profile, not a grade band
        detail: >-
          SUTD publishes a subject profile instead of a grade band. Of the A-Level
          students it offered places to in the 2025 exercise: almost 100% had taken
          H2 Mathematics, about half scoring A or B; most had taken H2 Physics or H2
          Chemistry or both, more than a third scoring A or B; and among those who
          had taken O-Levels, almost 100% scored A or B in Mathematics and Sciences.
          SUTD states that Physics is not compulsory, and that it reviews O-Level
          results and the two to three years before the final exam as well.
        source: sutd-igp-2026
      - kind: interview
        label: Additional assessment
        detail: >-
          SUTD reviews applications comprehensively, considering academic and
          personal attributes together, and may ask for further assessment. Grades
          are one part of the decision, not the whole of it.
        source: sutd-igp-2026

