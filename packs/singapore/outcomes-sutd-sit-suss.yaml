# SUTD, SIT and SUSS -- three universities that do NOT publish a 10th-90th
# percentile grade profile, and are therefore modelled differently on purpose.
#
#   SUSS  publishes, per programme and in two stages, the share of first-choice
#         applicants in each score band who were SHORTLISTED, and then the share
#         of those shortlisted who were OFFERED a place. Clearing the grade band
#         gets you an interview at SUSS, not a place.
#   SIT   publishes, per programme, the share of first-choice applicants in each
#         polytechnic GPA band who received an offer. Its A-Level figures are
#         aggregated across an academic CLUSTER, not a programme, so they are
#         not recorded against individual courses here.
#   SUTD  publishes no bands at all -- a subject profile of the students it
#         admitted. It is carried as an overlay, which is what it is.
#
# THE THING NOT TO UNDO: SUSS and SIT both publish against the RETIRED 90-point
# UAS (3 H2 + H1 + GP + PW). The AY2026 score is out of 70 (3 H2 + GP). Those
# two 60s are not the same 60. Every A-Level profile below is therefore marked
# `comparable: false`, the bands are still shown to the reader, and the engine
# withholds a verdict instead of producing one that would look ordinary and be
# wrong. Polytechnic GPA is out of 4.00 on both sides and compares properly.

